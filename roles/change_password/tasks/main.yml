---
# ==============================================================================
# Role: change_password
# Đổi mật khẩu an toàn và tương thích với mọi môi trường Linux
# ==============================================================================

- name: "Kiểm tra user '{{ target_user }}' có tồn tại trên VM không"
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"
  become: false

- name: "Đổi mật khẩu cho user '{{ target_user }}' (sử dụng Ansible user module)"
  ansible.builtin.user:
    name: "{{ target_user }}"
    password: "{{ new_password | password_hash('sha512') }}"
    update_password: always
  become: true
  no_log: true
  register: user_mod_result
  ignore_errors: true

- name: "Đổi mật khẩu dự phòng bằng /usr/sbin/chpasswd (nếu user module lỗi)"
  ansible.builtin.command: /usr/sbin/chpasswd
  args:
    stdin: "{{ target_user }}:{{ new_password }}\n"
  become: true
  no_log: true
  when: user_mod_result is failed
  register: chpasswd_result
  ignore_errors: true

- name: "Báo lỗi chi tiết nếu cả 2 cách đổi mật khẩu đều thất bại"
  ansible.builtin.fail:
    msg:
      - "❌ Đổi mật khẩu thất bại trên {{ inventory_hostname }}!"
      - "Lỗi module user: {{ user_mod_result.msg | default('N/A') }}"
      - "Lỗi chpasswd: {{ (chpasswd_result.stderr | default(chpasswd_result.msg | default('N/A'))) if (chpasswd_result is defined) else 'N/A' }}"
  when:
    - user_mod_result is failed
    - (chpasswd_result is not defined or chpasswd_result is failed)

- name: "Xóa session/cache sudo cũ (sudo -k)"
  ansible.builtin.command: sudo -k
  become: false
  changed_when: false

- name: "Xác thực mật khẩu MỚI qua sudo"
  ansible.builtin.command: sudo -S -p '' whoami
  args:
    stdin: "{{ new_password }}\n"
  become: false
  register: sudo_verify
  changed_when: false
  failed_when: sudo_verify.rc != 0 or 'root' not in sudo_verify.stdout
  no_log: true

- name: "Thông báo kết quả"
  ansible.builtin.debug:
    msg: "✅ [THÀNH CÔNG] {{ inventory_hostname }}: Mật khẩu của user '{{ target_user }}' đã được đổi và xác thực sudo thành công!"
