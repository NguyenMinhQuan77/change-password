---
# ==============================================================================
# Playbook đổi mật khẩu user hunghv trên danh sách VM
#
# Cách chạy (KHÔNG CẦN GÕ -k hay -K, playbook sẽ tự hỏi mật khẩu):
#   ansible-playbook site.yml -l 192.168.200.67
#   (hoặc toàn bộ server: ansible-playbook site.yml)
# ==============================================================================

- name: Đổi mật khẩu user hunghv trên các VM
  hosts: servers
  gather_facts: false

  vars_prompt:
    - name: current_password
      prompt: "🔑 Nhập mật khẩu HIỆN TẠI của user hunghv (dùng chung cho cả SSH và sudo)"
      private: true

    - name: new_password
      prompt: "🔒 Nhập mật khẩu MỚI cần đổi cho user hunghv"
      private: true

    - name: confirm_password
      prompt: "🔒 Xác nhận lại mật khẩu MỚI"
      private: true

  vars:
    ansible_password: "{{ current_password }}"
    ansible_become_password: "{{ current_password }}"

  pre_tasks:
    - name: Kiểm tra tính hợp lệ của mật khẩu mới
      ansible.builtin.fail:
        msg: >
          ❌ Lỗi mật khẩu mới:
          {% if new_password | length == 0 %}
          - Mật khẩu MỚI không được để trống!
          {% endif %}
          {% if confirm_password | length > 0 and new_password != confirm_password %}
          - Mật khẩu MỚI và mật khẩu XÁC NHẬN không khớp nhau!
          {% endif %}
          {% if new_password == current_password %}
          - Mật khẩu MỚI không được trùng với mật khẩu HIỆN TẠI!
          {% endif %}
      when: >
        (new_password | length == 0) or
        (confirm_password | length > 0 and new_password != confirm_password) or
        (new_password == current_password)
      run_once: true

  roles:
    - change_password
